services:
  nginx:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app-network

  app:
    image: nginx:alpine
    container_name: app
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
